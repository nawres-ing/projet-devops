name: CI
on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify
